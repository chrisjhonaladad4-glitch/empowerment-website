    <!-- Sound Controller Audio Context helper -->
    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = false;
                this.volume = 0.2;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playKeypress() {
                if (!this.enabled || !this.ctx) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400 + Math.random() * 200, this.ctx.currentTime);
                    gain.gain.setValueAtTime(this.volume * 0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.05);
                } catch(e) {}
            }
            playClick() {
                if (!this.enabled || !this.ctx) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(this.volume * 0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e) {}
            }
            playStaticBurst() {
                if (!this.enabled || !this.ctx) return;
                try {
                    this.init();
                    const bufferSize = this.ctx.sampleRate * 0.2;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1000;
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(this.volume * 0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.2);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                } catch(e) {}
            }
        }
        const soundEngine = new SoundEngine();
    </script>

    <script>
        // Game State & Persistence
        class AppState {
            constructor() {
                this.currentPage = 'home';
                this.version = 0; // 0.0.0, 0.0.1, 0.0.2, 0.0.3
                this.integrity = 67;
                this.soundEnabled = false;
                this.soundVolume = 0.2;
                this.glitchEffects = true;
                this.scanlineOpacity = 0.6;
                this.animationsEnabled = true;
                this.difficulty = 'normal';
                
                // Investigation progress
                this.cases = {
                    case1: { unlocked: true, completed: false, puzzleSolved: false },
                    case2: { unlocked: false, completed: false, puzzleSolved: false },
                    case3: { unlocked: false, completed: false, puzzleSolved: false },
                    case4: { unlocked: false, completed: false, puzzleSolved: false }
                };
                
                // Endings seen: 'wrongman', 'architect', 'perfect', 'true'
                this.endingsSeen = [];
                this.hiddenFileUnlocked = false;
                this.trueEndingReached = false;
                this.boardConnections = [];
                this.customNotes = '';
                this.messagesLog = [];
                
                this.loadFromStorage();
            }

            saveToStorage() {
                const data = {
                    version: this.version,
                    integrity: this.integrity,
                    soundEnabled: this.soundEnabled,
                    soundVolume: this.soundVolume,
                    glitchEffects: this.glitchEffects,
                    scanlineOpacity: this.scanlineOpacity,
                    animationsEnabled: this.animationsEnabled,
                    difficulty: this.difficulty,
                    cases: this.cases,
                    endingsSeen: this.endingsSeen,
                    hiddenFileUnlocked: this.hiddenFileUnlocked,
                    trueEndingReached: this.trueEndingReached,
                    boardConnections: this.boardConnections,
                    customNotes: this.customNotes,
                    messagesLog: this.messagesLog
                };
                localStorage.setItem('nobody_exe_state', JSON.stringify(data));
            }

            loadFromStorage() {
                const saved = localStorage.getItem('nobody_exe_state');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        this.version = data.version || 0;
                        this.integrity = data.integrity !== undefined ? data.integrity : 67;
                        this.soundEnabled = !!data.soundEnabled;
                        this.soundVolume = data.soundVolume !== undefined ? data.soundVolume : 0.2;
                        this.glitchEffects = data.glitchEffects !== undefined ? data.glitchEffects : true;
                        this.scanlineOpacity = data.scanlineOpacity !== undefined ? data.scanlineOpacity : 0.6;
                        this.animationsEnabled = data.animationsEnabled !== undefined ? data.animationsEnabled : true;
                        this.difficulty = data.difficulty || 'normal';
                        if (data.cases) this.cases = data.cases;
                        if (data.endingsSeen) this.endingsSeen = data.endingsSeen;
                        this.hiddenFileUnlocked = !!data.hiddenFileUnlocked;
                        this.trueEndingReached = !!data.trueEndingReached;
                        if (data.boardConnections) this.boardConnections = data.boardConnections;
                        this.customNotes = data.customNotes || '';
                        if (data.messagesLog) this.messagesLog = data.messagesLog;
                    } catch (e) {
                        console.error("Failed to load save state", e);
                    }
                }
                soundEngine.enabled = this.soundEnabled;
                soundEngine.volume = this.soundVolume;
                document.documentElement.style.setProperty('--scanline-opacity', this.scanlineOpacity);
            }

            resetInvestigationForCycle(newVersion) {
                this.version = newVersion;
                // Preserve hidden progress, clear ordinary case completion
                this.cases = {
                    case1: { unlocked: true, completed: false, puzzleSolved: false },
                    case2: { unlocked: false, completed: false, puzzleSolved: false },
                    case3: { unlocked: false, completed: false, puzzleSolved: false },
                    case4: { unlocked: false, completed: false, puzzleSolved: false }
                };
                this.saveToStorage();
            }

            navigateTo(page) {
                soundEngine.playClick();
                this.currentPage = page;
                
                // Hide all views
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                
                // Show target view
                const target = document.getElementById(`view-${page}`);
                if (target) {
                    target.classList.remove('hidden');
                }
                
                // Update navigation highlights
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.getAttribute('data-page') === page) {
                        btn.classList.add('bg-cyan-950', 'text-cyan-400', 'border', 'border-cyan-800');
                    } else {
                        btn.classList.remove('bg-cyan-950', 'text-cyan-400', 'border', 'border-cyan-800');
                    }
                });

                // Update version display
                const verStr = `v0.0.${this.version}`;
                document.getElementById('nav-version').innerText = verStr;

                // Render view content
                renderCurrentView();
                window.scrollTo(0, 0);
            }

            toggleMobileMenu() {
                soundEngine.playClick();
                const menu = document.getElementById('mobile-menu');
                menu.classList.toggle('hidden');
            }

            showModal(title, htmlContent, buttonsHtml = '') {
                soundEngine.playStaticBurst();
                const container = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');
                content.innerHTML = `
                    <div class="flex justify-between items-center border-b border-cyan-800/50 pb-3">
                        <h3 class="font-mono font-bold text-cyan-400 text-sm tracking-wider">${title}</h3>
                        <button onclick="appState.closeModal()" class="text-gray-400 hover:text-cyan-300 font-mono text-xs">[CLOSE]</button>
                    </div>
                    <div class="text-sm text-gray-300 space-y-3 font-sans">${htmlContent}</div>
                    <div class="flex justify-end space-x-2 pt-3 border-t border-cyan-800/30">${buttonsHtml}</div>
                `;
                container.classList.remove('hidden');
            }

            closeModal() {
                soundEngine.playClick();
                document.getElementById('modal-container').classList.add('hidden');
            }
        }

        const appState = new AppState();
    </script>
